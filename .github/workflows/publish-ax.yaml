# Publishes the AX task image (Dockerfile.ax) to ghcr.io/<owner>/artex-task-runner.
# AX Tasks should reference it by the digest this run prints.
name: publish-ax

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.ax
      - requirements.txt
      - app.py
      - cli.py
      - core/**
      - modules/**
      - utils/**
      - templates/**
      - .github/workflows/publish-ax.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/artex-task-runner
          tags: |
            type=sha
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ax
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - run: echo "ghcr.io/${{ github.repository_owner }}/artex-task-runner@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
